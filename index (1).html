<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행정정보 통합관리 기본법 조항 검색</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 관보식 머리 → 카드뉴스 4장 띠 → 검색 막대 → 장(章)별로 묶인 조항 카드 격자 */
:root{
  --bg:#f5f7fa; --surface:#ffffff; --ink:#152238; --muted:#5b6678; --line:#d8dee8;
  --navy:#1c4a7a; --mark:#fde68a; --mark-ink:#152238; --chip:#e8eef6;
  --display:"Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#152132; --ink:#e6ecf4; --muted:#9aa8bb; --line:#2a3a50;
  --navy:#8fb7e4; --mark:#7a5d12; --mark-ink:#fff6d6; --chip:#1d2d44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#152132; --ink:#e6ecf4; --muted:#9aa8bb; --line:#2a3a50;
  --navy:#8fb7e4; --mark:#7a5d12; --mark-ink:#fff6d6; --chip:#1d2d44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:32px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.meta{font-size:13px;color:var(--muted);letter-spacing:.02em;font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vw,38px);line-height:1.25;margin:0;text-wrap:balance}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--navy);border:1px solid var(--navy);border-radius:3px;padding:0 6px;margin-right:6px;vertical-align:middle}
.news{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:0}
.news figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.news img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1/1;object-fit:cover;
  border-radius:6px;image-rendering:-webkit-optimize-contrast;image-rendering:high-quality;
  box-shadow:0 1px 3px rgba(0,0,0,.18);transform:translateZ(0);backface-visibility:hidden}
.news figcaption{font-size:13.5px;font-weight:600;color:var(--ink)}
@media (max-width:480px){.news{grid-template-columns:1fr}}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 260px;min-width:0;font:inherit;font-size:16px;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
#q:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px color-mix(in srgb,var(--navy) 25%,transparent)}
#count{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#count b{color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font:inherit;font-size:13px;border:0;border-radius:999px;padding:3px 12px;background:var(--chip);color:var(--ink);cursor:pointer}
.chips button:hover,.chips button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.chapter{display:flex;flex-direction:column;gap:12px}
.chapter h2{font-family:var(--display);font-size:18px;margin:0;display:flex;gap:10px;align-items:baseline}
.chapter h2 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .no{font-size:13px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}
.card h3{margin:0;font-family:var(--display);font-size:17px;line-height:1.35}
.card p{margin:0;color:var(--muted);font-size:14px}
.card details summary{cursor:pointer;font-size:13px;color:var(--navy);font-weight:500}
.card details pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;margin:8px 0 0;color:var(--ink);line-height:1.7}
mark{background:var(--mark);color:var(--mark-ink);padding:0 1px;border-radius:2px}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
footer{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--navy)}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="meta">[시행 2026. 7. 1.] [법률 제99999호, 2026. 6. 1., 가상 제정] · 행정안전부 디지털정부실</div>
    <h1><span class="tag">가상</span>행정정보 통합관리 기본법</h1>
    <div class="meta">본칙 14개조 · 부칙 1개조 · 실제 법령과 무관한 연습용 자료</div>
  </header>

  <section class="news" aria-label="카드뉴스">
    <figure><img src="images/cardnews1.png" alt="카드뉴스 1 기본법 구조: 총칙, 정책, 의무, 표준화, 운영, 보칙" loading="eager" decoding="async"><figcaption>#1 기본법 구조</figcaption></figure>
    <figure><img src="images/cardnews2.png" alt="카드뉴스 2 핵심 정의: 행정정보, 통합관리, 데이터 표준, 공동활용" loading="eager" decoding="async"><figcaption>#2 핵심 정의</figcaption></figure>
    <figure><img src="images/cardnews3.png" alt="카드뉴스 3 국가 책무: 기본계획 수립, 표준 마련 및 공표, 시스템 운영 관리" loading="eager" decoding="async"><figcaption>#3 국가 책무</figcaption></figure>
    <figure><img src="images/cardnews4.png" alt="카드뉴스 4 정보 보안: 암호화 의무, 접근통제 강화, 사고 즉시 보고" loading="eager" decoding="async"><figcaption>#4 정보 보안</figcaption></figure>
  </section>

  <section class="search" aria-label="조항 검색">
    <div class="row">
      <input id="q" type="search" placeholder="제목 또는 본문으로 검색 (예: 기본계획, 대통령령)" autocomplete="off" aria-label="검색어">
      <span id="count" aria-live="polite">결과 <b>0</b>건</span>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <main id="list"></main>

  <footer>조항 데이터: data.json (조·제목·본문 15건) · 카드뉴스 이미지 4장 임베드 · 검색은 제목과 본문을 대상으로 하며 대소문자·띄어쓰기를 그대로 비교합니다.</footer>
</div>

<script>
const FALLBACK = [{"조": "제1조", "제목": "목적", "본문": "이 법은 행정정보의 통합관리와 공동활용에 관한 기본적인 사항을 정함으로써 행정의 효율성과 국민의 편익 증진에 이바지함을 목적으로 한다."}, {"조": "제2조", "제목": "정의", "본문": "이 법에서 사용하는 용어의 뜻은 다음 각 호와 같다.\n1. \"행정정보\"란 「전자정부법」 제2조제6호에 따른 행정정보를 말한다.\n2. \"공동활용\"이란 행정기관 간 행정정보를 상호 제공하여 사용하는 것을 말한다.\n3. \"통합관리\"란 「공공기록물 관리에 관한 법률」 제3조에 따른 기록물의 일부로 행정정보를 통합 관리하는 것을 말한다.\n4. \"데이터 표준\"이란 행정정보의 공동활용을 위한 형식·코드·식별자에 관한 표준을 말한다."}, {"조": "제3조", "제목": "다른 법률과의 관계", "본문": "행정정보의 통합관리 및 공동활용에 관하여 다른 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다. 특히 「개인정보 보호법」, 「공공데이터의 제공 및 이용 활성화에 관한 법률」, 「지능정보화 기본법」에 따른 사항은 해당 법률을 우선 적용한다."}, {"조": "제4조", "제목": "국가 등의 책무", "본문": "국가와 지방자치단체는 행정정보의 통합관리와 공동활용을 위하여 필요한 시책을 수립하여야 한다. 행정안전부장관은 그 시책을 종합적으로 조정하며, 자세한 사항은 대통령령으로 정한다."}, {"조": "제5조", "제목": "기본계획의 수립", "본문": "① 행정안전부장관은 행정정보 통합관리 기본계획을 5년마다 수립하여야 한다.\n② 기본계획에는 다음 각 호의 사항을 포함하여야 한다.\n1. 행정정보 통합관리의 기본방향\n2. 행정정보 공동활용의 활성화 방안\n3. 「전자정부법」 제3조의 행정기관 정보화 시책과의 연계\n4. 그 밖에 대통령령으로 정하는 사항"}, {"조": "제6조", "제목": "시행계획의 수립", "본문": "행정기관의 장은 매년 시행계획을 수립하여야 하며, 그 결과를 행정안전부장관에게 보고하여야 한다. 시행계획의 형식과 절차는 대통령령으로 정한다."}, {"조": "제7조", "제목": "공동활용 협의회", "본문": "행정정보 공동활용에 관한 사항을 협의하기 위하여 행정안전부에 행정정보 공동활용 협의회를 둔다. 협의회의 구성과 운영에 필요한 사항은 대통령령으로 정한다."}, {"조": "제8조", "제목": "공동활용 신청", "본문": "행정기관의 장은 다른 행정기관이 보유한 행정정보를 활용하려는 경우에는 행정안전부장관에게 신청하여야 한다."}, {"조": "제9조", "제목": "공동활용 승인", "본문": "행정안전부장관은 신청을 받은 경우 「개인정보 보호법」 제17조에 따른 절차를 거쳐 30일 이내에 승인 여부를 결정하여야 한다."}, {"조": "제10조", "제목": "보안 조치", "본문": "공동활용 시 행정정보의 안전성 확보를 위하여 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」 및 「개인정보 보호법」에서 정하는 보안 조치를 적용하여야 한다."}, {"조": "제11조", "제목": "데이터 표준", "본문": "행정안전부장관은 데이터 표준을 정하여 고시할 수 있다. 데이터 표준의 적용 범위와 시기는 대통령령으로 정한다."}, {"조": "제12조", "제목": "표준 적용 의무", "본문": "행정기관은 행정정보를 생산·관리·활용할 때 제11조에 따른 데이터 표준을 따라야 한다."}, {"조": "제13조", "제목": "실태조사", "본문": "행정안전부장관은 매년 행정정보 통합관리 실태를 조사하여 그 결과를 공개한다."}, {"조": "제14조", "제목": "과태료", "본문": "다음 각 호의 어느 하나에 해당하는 자에게는 1천만원 이하의 과태료를 부과한다.\n1. 제8조를 위반하여 승인 없이 공동활용한 자\n2. 제12조에 따른 데이터 표준을 정당한 사유 없이 위반한 자"}, {"조": "부칙 제1조", "제목": "시행일", "본문": "이 법은 2026년 7월 1일부터 시행한다."}];
const CHAPTERS = [
  {name:"제1장 총칙", range:[1,4]},
  {name:"제2장 기본계획 및 추진체계", range:[5,7]},
  {name:"제3장 공동활용", range:[8,10]},
  {name:"제4장 데이터 표준화", range:[11,12]},
  {name:"제5장 감독·벌칙", range:[13,14]},
  {name:"부칙", range:null}
];
const CHIPS = ["기본계획","공동활용","데이터 표준","대통령령","개인정보","행정안전부장관"];
const $ = s => document.querySelector(s);
let DATA = [];

const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl = (text, q) => {
  const t = esc(text);
  if (!q) return t;
  const eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(eq, "g"), m => `<mark>${m}</mark>`);
};
const summary = body => {
  const first = body.split("\n")[0].replace(/^①\s*/, "");
  return first.length > 72 ? first.slice(0, 72) + "…" : first;
};
const chapterOf = a => {
  if (a.조.startsWith("부칙")) return CHAPTERS[5].name;
  const n = parseInt(a.조.replace(/\D/g, ""), 10);
  return (CHAPTERS.find(c => c.range && n >= c.range[0] && n <= c.range[1]) || CHAPTERS[0]).name;
};

function render() {
  const q = $("#q").value.trim();
  const hits = DATA.filter(a => !q || a.제목.includes(q) || a.본문.includes(q));
  $("#count").innerHTML = `결과 <b>${hits.length}</b>건`;
  if (!hits.length) {
    $("#list").innerHTML = `<div class="empty">‘${esc(q)}’이(가) 들어간 조항이 없습니다. 다른 낱말로 검색해 보세요.</div>`;
    return;
  }
  const groups = {};
  hits.forEach(a => (groups[chapterOf(a)] ||= []).push(a));
  $("#list").innerHTML = CHAPTERS.filter(c => groups[c.name]).map(c => `
    <section class="chapter">
      <h2>${c.name}<small>${groups[c.name].length}개 조항</small></h2>
      <div class="grid">${groups[c.name].map(a => `
        <article class="card">
          <span class="no">${esc(a.조)}</span>
          <h3>${hl(a.제목, q)}</h3>
          <p>${hl(summary(a.본문), q)}</p>
          <details${q && a.본문.includes(q) ? " open" : ""}>
            <summary>본문 전체</summary>
            <pre>${hl(a.본문, q)}</pre>
          </details>
        </article>`).join("")}
      </div>
    </section>`).join("");
}

$("#chips").innerHTML = CHIPS.map(k => `<button type="button" data-k="${k}">${k}</button>`).join("") +
  `<button type="button" data-k="">전체 보기</button>`;
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("#q").value = b.dataset.k; render(); $("#q").focus();
});
$("#q").addEventListener("input", render);

DATA = FALLBACK; render();
fetch("data.json").then(r => r.ok ? r.json() : Promise.reject())
  .then(j => { if (Array.isArray(j) && j.length) { DATA = j; render(); } })
  .catch(() => {});
</script>

</body>
</html>
